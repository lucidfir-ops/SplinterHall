<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C0C0B">
<title>Splinterhall</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #0c0c0b; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #e8e2d4; font: 700 14px/1.4 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .2em; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="boot">LOADING</div>
<script type="module" src="game.js"></script>
</body>
</html>
